<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Registros</title>
    <style>
        body { font-family: monospace; background: #111; color: #00ff00; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #00ff00; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h1>[+] Registros de Conexión (IP / Fecha)</h1>
    <table>
        <thead>
            <tr><th>#</th><th>IP Visitante</th><th>Fecha y Hora</th></tr>
        </thead>
        <tbody id="logs"></tbody>
    </table>
    <script>
        async function fetchLogs() {
            const res = await fetch('/api/logs');
            const data = await res.json();
            const tbody = document.getElementById('logs');
            tbody.innerHTML = '';
            data.forEach((log, i) => {
                tbody.innerHTML += `<tr><td>${i+1}</td><td>${log.ip}</td><td>${log.date}</td></tr>`;
            });
        }
        fetchLogs();
        setInterval(fetchLogs, 3000);
    </script>
</body>
</html>
