<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gatos Lindos 🐾</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .gallery { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        img { width: 280px; height: 180px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Galería de Gatos Lindos 🐱</h1>
    <p>¡Bienvenido a la colección!</p>
    <div class="gallery">
        <div class="card">
            <img src="https://placekitten.com/300/200" alt="Gato 1">
            <h3>Gatito Dormilón</h3>
        </div>
        <div class="card">
            <img src="https://placekitten.com/301/200" alt="Gato 2">
            <h3>Gatito Curioso</h3>
        </div>
    </div>
</body>
</html>
